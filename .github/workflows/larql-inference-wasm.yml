# larql-inference WASM CI
#
# Tests the pure-computation subset of larql-inference on wasm32-unknown-unknown.
#
# ~57 tests across 3 integration test files run under Node.js:
#   test_backend (19), test_fused_attention (23), test_modules (15, minus 2 native-only).
#
# The remaining 17 integration test files use std::fs fixtures, vindex, model
# env vars, or wasm32-wasip1 expert binaries and are excluded via
# #![cfg(not(target_arch = "wasm32"))] at their file tops.
# Inline src/ test modules are similarly gated with
# #[cfg(all(test, not(target_arch = "wasm32")))].
#
# The `remote` feature (reqwest blocking / hf-hub) is not enabled.
# The `metal` feature (macOS Metal GPU) is not enabled.

name: larql-inference-wasm

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-inference/**'
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-inference-wasm.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'crates/larql-inference/**'
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'crates/larql-vindex/**'
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-inference-wasm.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: wasm · ${{ matrix.mode.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: serial
            toolchain: stable
            rustflags: ''
          - name: parallel
            toolchain: nightly
            rustflags: '-C target-feature=+atomics,+bulk-memory,+mutable-globals'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (${{ matrix.mode.toolchain }}) + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.mode.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm32-cargo-inference-${{ matrix.mode.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm32-cargo-inference-${{ matrix.mode.name }}-

      - name: Format check
        run: cargo fmt -p larql-inference -- --check

      - name: Check
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo check -p larql-inference --target wasm32-unknown-unknown --no-default-features

      - name: Clippy
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo clippy -p larql-inference --target wasm32-unknown-unknown --no-default-features -- -D warnings

      - name: wasm-pack test · node
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: wasm-pack test --node crates/larql-inference

      - name: wasm-pack test · firefox
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: wasm-pack test --firefox --headless crates/larql-inference --features browser-tests
