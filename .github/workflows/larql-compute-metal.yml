# larql-compute-metal CI (Apple Silicon).
#
# Metal GPU backend for larql-compute.  Extracted from `larql-compute`
# per ADR-019 so non-Mac CI hosts (Linux, Windows) don't have to build
# or check Metal-specific code.  All jobs run on macos-14 (the latest
# Apple-silicon GitHub-hosted runner with Metal available).

name: larql-compute-metal

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-compute-metal/**'
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute-metal.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-compute-metal/**'
      - 'crates/larql-compute/**'
      - 'crates/larql-models/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-compute-metal.yml'
  workflow_dispatch: {}

jobs:
  test:
    name: test · macos-14
    runs-on: macos-14
    # 45 was below this job's own runtime. Observed durations across
    # 2026-08-26/27: 41, 44, 44, 48, 51 and 64 minutes — so the limit sat
    # in the middle of the distribution and cancelled runs at random,
    # mid-test, before the coverage policy step it exists to gate ever
    # executed. A cancelled run also renders as a failed check, so the
    # signal was indistinguishable from a real regression. The suite is
    # genuinely slow (llvm-cov instrumentation, --test-threads=1 to
    # serialise the env-sensitive GPU tests); this is headroom over the
    # worst observed run, not an invitation to grow into it.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macOS-cargo-reg2-compute-metal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macOS-cargo-reg2-compute-metal-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      - name: Format check
        run: cargo fmt -p larql-compute-metal -- --check

      - name: Check default
        run: cargo check -p larql-compute-metal --all-targets

      - name: Clippy (no-deps)
        # `--no-deps` so warnings in sibling crates' in-flight work do
        # not promote to errors here; the matching `make` target uses
        # the same flag for the same reason.
        run: cargo clippy -p larql-compute-metal --all-targets --no-deps -- -D warnings

      # `--test-threads=1` serialises the test runner, matching the Makefile
      # targets (`larql-compute-metal-test{,-tests}`). Many tests read
      # process-global state cached at `MetalBackend::new()` (decode flags) and
      # share the single GPU; cargo's default parallel runner races on them and
      # intermittently yields NaN/zero pipeline output. Serial execution is the
      # same fix larql-inference uses for its OpenBLAS global-buffer race.
      - name: Unit tests
        run: cargo test -p larql-compute-metal --lib -- --test-threads=1

      - name: Integration tests
        run: cargo test -p larql-compute-metal --tests -- --test-threads=1

      - name: Coverage policy gate
        run: |
          cargo install --locked cargo-llvm-cov
          make larql-compute-metal-coverage-summary
