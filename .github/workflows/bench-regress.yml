# Bench regression detector — runs `scripts/bench-regress.sh check` on
# every PR against a baseline saved on `main`. Fails the workflow if any
# cell in the criterion bench suite regresses past Criterion's noise
# threshold.
#
# Surface covered (`make bench-save` / `make bench-check`):
#   - `quant_matvec`: Q4_0 / Q4_K / Q4_KF / Q6_K × 3 shapes × cpu/metal
#   - `matmul`: f32 matmul + f32_gemv (lm-head) — cpu vs metal
#   - `linalg`: cholesky + ridge solve (cpu only)
#
# That's the surface where the next throughput cliff would show up
# first. The 75 %-row drop in `q4_matvec_v4` would have shown as a 4×
# regression at `quant_matvec_q4_0/metal/lm_head_262144` weeks before
# goldens caught it.

name: bench-regress

# ── Two honesty caveats on what this gate can establish. ──
#
# 1. The comparison is CROSS-RUNNER. The baseline is recorded on a
#    `main` push, cached, and restored onto a DIFFERENT macos-14 runner
#    for the PR. Criterion then compares absolute timings across two
#    physical machines at different times, which this repo's own bench
#    discipline does not accept anywhere else: the decode benchmark in
#    `opplan/exec/tests/q2a_decode_bench.rs` runs BOTH arms in one
#    process, interleaved with alternating order, and takes a min-of-N
#    floor, precisely because a cross-session number is not a
#    measurement. Read a red here as a SIGNAL to go and measure
#    properly, never as proof a change caused it.
#
# 2. It therefore only runs where it could plausibly be causal. The
#    gated surface is `larql-compute` and `larql-compute-metal` (see
#    BENCHES in scripts/bench-regress.sh); a PR that cannot reach those
#    crates cannot have caused a movement in them, and a red on such a
#    PR is pure runner variance masquerading as attribution. That
#    happened twice on 2026-09-01 — a +31 % "regression" in
#    `ridge_decomposition_solve` on branches touching only
#    `larql-vindex` — which is what motivated the paths filter below.
#
# Fixing (1) properly means benchmarking main and the PR head back to
# back on the SAME runner in one job. That doubles bench wall-clock and
# is tracked separately.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-compute/**'
      - 'crates/larql-compute-metal/**'
      - 'scripts/bench-regress.sh'
      - '.github/workflows/bench-regress.yml'
      - 'Cargo.lock'
  # Manual trigger so a maintainer can re-baseline after intentional
  # perf changes without waiting for the next merge to main — and so a
  # reviewer can ask for the check on a PR the paths filter skipped.
  workflow_dispatch: {}

jobs:
  bench:
    # macos-14 = Apple Silicon (M1+). Required for the metal cells —
    # without it, drop --features gpu from FEATURES to skip them
    # and run only the CPU surface on any runner.
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # Cargo deps are big and stable across PRs — separate cache.
      - name: Cache cargo deps
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-bench-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # Criterion baselines: write-through on main, read-only on PRs.
      # Keyed by the run number so each main push refreshes the cache.
      - name: Cache criterion baseline (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: target/criterion
          key: ${{ runner.os }}-criterion-baseline-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-criterion-baseline-

      - name: Restore criterion baseline (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: target/criterion
          key: ${{ runner.os }}-criterion-baseline-
          restore-keys: |
            ${{ runner.os }}-criterion-baseline-

      - name: Save baseline (main only)
        if: github.ref == 'refs/heads/main'
        run: make bench-save

      - name: Check vs baseline (PRs + manual)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          # Call the script DIRECTLY, never through `make`. GNU make exits
          # 2 for any failed recipe (1 is reserved for `-q`), so going via
          # `make bench-check` aliases the script's exit 1 (regression
          # detected) onto its exit 2 (no baseline) — and the cold-start
          # branch below then soft-passes a real regression as green. The
          # 0 = clean / 1 = regression / 2 = no baseline contract only
          # survives an unwrapped call.
          #
          # Cold cache → the script prints "no baseline found" and exits 2.
          # Treat that as neutral: the first PR after CI is stood up
          # shouldn't fail just because there's no baseline yet.
          set +e
          bash scripts/bench-regress.sh check
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning::no criterion baseline cached; skipping regression check"
            exit 0
          fi
          exit "$rc"

      # On regression, attach the criterion HTML report so reviewers
      # can see the per-cell delta without re-running locally.
      - name: Upload criterion report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 14
