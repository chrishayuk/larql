name: verifier

# The contract verifier: separate from the engine it measures, so separate CI.
# See docs/verification/independence.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    paths:
      - 'verifier/**'
      - 'docs/verification/**'
      - '.github/workflows/verifier.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boundary:
    name: boundary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: One change must not move both the engine and its measurement
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ALLOWED: ${{ contains(github.event.pull_request.labels.*.name, 'verifier-and-engine') }}
        run: |
          changed=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          measurement=$(printf '%s\n' "$changed" | grep -E '^verifier/(refcheck|larql_contract_verifier|expected|provenance)/' || true)
          engine=$(printf '%s\n' "$changed" | grep -E '^crates/' || true)
          if [ -n "$measurement" ] && [ -n "$engine" ]; then
            if [ "$ALLOWED" = "true" ]; then
              echo "::warning::This pull request changes both, allowed by the verifier-and-engine label."
              exit 0
            fi
            echo "::error::This pull request changes both the verifier's measurement and the engine. Split it, or apply the verifier-and-engine label. See docs/verification/independence.md."
            printf 'Measurement:\n%s\n\nEngine:\n%s\n' "$measurement" "$engine"
            exit 1
          fi

  test:
    name: test · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verifier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install from the lockfile, hashes checked
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --require-hashes --no-deps -r requirements.lock
          .venv/bin/pip install --quiet --no-deps .

      - name: Tests
        run: .venv/bin/python -I -m unittest discover -s tests -v

      - name: The executable answers by the protocol
        run: |
          .venv/bin/larql-verifier contract --contract NOT-A-CONTRACT --container . --source . > answer.json
          .venv/bin/python -I -c "
          import json
          a = json.load(open('answer.json'))
          assert a['schema'] == 'larql-verify-contract/1' and a['status'] == 'could_not_evaluate', a
          "
