# larql-demos cross-platform CI
#
# The crate holds no logic — every target is an `examples/*.rs` binary —
# so there is nothing to unit-test or measure coverage on. What CI must
# guarantee is that the demos still compile against the crates they
# demonstrate, and that the weight-free ones still run.
#
# Demos needing model weights are compiled here but not executed; they
# are exercised by hand against a real vindex.

name: larql-demos

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-demos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-demos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-demos/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-demos.yml'
  workflow_dispatch: {}

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # protoc on PATH satisfies the `cfg(windows)` no-op in
      # `larql-router-protocol`'s build.rs. `larql-demos` depends on
      # `larql-router-protocol` directly for the server demos.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-demos-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-demos-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      - name: Format check
        run: cargo fmt -p larql-demos -- --check

      - name: Check (all targets)
        run: cargo check -p larql-demos --all-targets

      - name: Clippy (warnings as errors)
        run: cargo clippy -p larql-demos --all-targets --no-deps -- -D warnings

      # The weight-free demos, i.e. exactly the set larql-core and
      # larql-boundary used to run before these moved here.
      - name: Run the weight-free demos
        run: |
          cargo run -p larql-demos --example edge_demo
          cargo run -p larql-demos --example graph_demo
          cargo run -p larql-demos --example algorithm_demo
          cargo run -p larql-demos --example filter_demo
          cargo run -p larql-demos --example serialization_demo
          cargo run -p larql-demos --example encode_decode
          cargo run -p larql-demos --example gate_decision
