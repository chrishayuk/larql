# larql-core cross-platform CI
#
# Runs fmt + feature matrix + clippy + tests + examples + bench test-mode on
# Linux, Windows, and macOS. The crate is model-architecture agnostic and these
# checks require no model weights or platform-specific backends.

name: larql-core

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-core.yml'
  workflow_dispatch: {}

# Supersede in-flight pull-request runs: pushing a new commit to a PR
# cancels the runs still compiling the previous one.
#
# Non-PR runs (main pushes, schedules, manual dispatch) are keyed by
# `run_id`, which is unique per run, so they are each alone in their
# group. That is deliberate and not the same as `cancel-in-progress:
# false`: a concurrency group holds at most one running and one pending
# run, and a newer pending run EVICTS the older pending one. Grouping
# every main push under `refs/heads/main` would therefore still destroy
# the CI record for an intermediate main commit when merges land close
# together, with cancellation disabled or not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # protoc on PATH satisfies the `cfg(windows)` no-op in
      # `larql-router-protocol`'s build.rs. Required because the
      # "Run examples" step below builds `larql-demos`, which depends
      # on `larql-router-protocol` directly.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-core-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      - name: Format check
        run: cargo fmt -p larql-core -- --check

      - name: Check default features
        run: cargo check -p larql-core --all-targets

      - name: Check no default features
        run: cargo check -p larql-core --no-default-features --all-targets

      - name: Check msgpack-only feature
        run: cargo check -p larql-core --no-default-features --features msgpack --all-targets

      - name: Clippy default features
        run: cargo clippy -p larql-core --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test -p larql-core

      - name: Feature matrix tests
        run: |
          cargo test -p larql-core --no-default-features
          cargo test -p larql-core --no-default-features --features msgpack

      - name: Test benchmarks
        run: cargo test -p larql-core --benches

      - name: Run examples
        run: |
          cargo run -p larql-demos --example edge_demo
          cargo run -p larql-demos --example graph_demo
          cargo run -p larql-demos --example algorithm_demo
          cargo run -p larql-demos --example filter_demo
          cargo run -p larql-demos --example serialization_demo

  coverage:
    name: coverage · ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-core --summary-only
