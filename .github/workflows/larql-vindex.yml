# larql-vindex cross-platform CI
#
# The crate checks here are model/model-architecture agnostic: no HuggingFace
# downloads, no real model weights, and no platform-specific GPU backends.
# Tests and examples use synthetic fixtures or compile-only checks so the same
# surface runs on Linux, Windows, and macOS.

name: larql-vindex

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-vindex/**'
      - 'crates/larql-lql/src/executor/lifecycle/compile/into_vindex.rs'
      - 'crates/larql-compute/src/cpu/ops/q4k_q8k_dot.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-vindex.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/larql-vindex/**'
      - 'crates/larql-lql/src/executor/lifecycle/compile/into_vindex.rs'
      - 'crates/larql-compute/src/cpu/ops/q4k_q8k_dot.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - '.github/workflows/larql-vindex.yml'
  workflow_dispatch: {}

env:
  LARQL_VINDEX_COVERAGE_MIN: 71
  # Fail extraction on any source tensor no `ModelArchitecture` accessor
  # names. Off by default in the library (flipping it would break existing
  # extractions of merely-incomplete architectures), but CI is exactly where
  # an unnamed tensor should stop the line: every silent-drop bug this
  # codebase has had was a naming gap that shipped because nothing failed.
  # See `extract::streaming::stages::tensor_audit`.
  LARQL_EXTRACT_STRICT: 1

jobs:
  test:
    name: test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install OpenBLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$vcpkgRoot\vcpkg.exe" install openblas:x64-windows

      # protoc on PATH satisfies the `cfg(not(windows))` skip in
      # `larql-router-protocol`'s build.rs. Required by larql-vindex's
      # dev-dep on `larql-inference` → transitive on `larql-router-protocol`
      # (added in #96 for MLA absorption integration tests).
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y --no-progress

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-vindex-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-vindex-

      - name: Format check
        run: cargo fmt -p larql-vindex -- --check

      - name: Check all targets
        run: cargo check -p larql-vindex --all-targets

      - name: Check examples
        run: cargo check -p larql-vindex --examples

      # The `gpu` feature pulls in larql-compute-metal, so this can only
      # build on macOS. It is a TYPE-CHECK, not a test run: the gate it
      # guards (`opplan::exec::tests::kimi_moe_metal`) needs a ~245 MiB
      # fixture that only exists on a developer machine, and skips
      # everywhere else.
      #
      # Why it earns a CI step anyway: Kimi execution now depends on the
      # bf16 Metal API, and nothing else in CI compiles this module. A
      # rename or signature change in larql-compute-metal would break it
      # silently and stay broken until someone next ran it by hand.
      - name: Check gpu feature (macOS only)
        if: runner.os == 'macOS'
        run: cargo check -p larql-vindex --features gpu --all-targets

      - name: Clippy
        run: cargo clippy -p larql-vindex --all-targets -- -D warnings

      # E0 — VINDEX2 preservation. Named separately from the general test
      # step so a failure reads as "the shipped generation regressed" rather
      # than as one red test among hundreds. Any regression blocks merge:
      # finding one now identifies the introducing commit, finding one after
      # another ten changes produces archaeology.
      #
      # Scope caveat: this is the generation-boundary subset. The full matrix
      # (decode, WALK, slice, publish/pull) needs multi-GB checkpoints and
      # runs locally against tests/goldens/e0 via scripts/e0-capture-goldens.sh.
      - name: E0 - VINDEX2 preservation (generation boundary)
        run: cargo test -p larql-vindex --test e0_generation_boundary

      - name: Tests
        run: cargo test -p larql-vindex

      - name: Benchmark compile/tests
        run: cargo test -p larql-vindex --benches

  coverage:
    name: coverage - ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary
        run: cargo llvm-cov --package larql-vindex --summary-only --fail-under-lines "$LARQL_VINDEX_COVERAGE_MIN"

      - name: Coverage policy
        run: |
          mkdir -p coverage/larql-vindex
          cargo llvm-cov report --package larql-vindex --json --summary-only --output-path coverage/larql-vindex/summary.json
          python3 scripts/check_coverage_policy.py coverage/larql-vindex/summary.json crates/larql-vindex/coverage-policy.json
