# Workspace-level quality and supply-chain gates.
#
# The per-crate workflows (larql-*.yml) each cover fmt / check / clippy /
# test / coverage for one crate. Nothing there looks at the dependency
# graph as a whole, so until this workflow existed a RUSTSEC advisory
# against a transitive crate was invisible to CI. See issue #165.
#
# Jobs:
#   audit       — RustSec advisory scan of Cargo.lock            (blocking)
#   deny        — licences, advisories, sources, bans            (blocking)
#   msrv        — the declared rust-version really compiles      (blocking)
#   proto-lint  — buf lint over the four gRPC schemas            (blocking)
#   doc-links   — every relative Markdown link resolves          (blocking)
#
# Mutation testing lives in `mutants.yml`, not here: it is informational,
# and a job cancelled by `timeout-minutes` concludes the whole run as
# `cancelled` no matter how it is declared — which turned this check red
# on the largest PRs while every gate in it had passed.
#
# NOTE ON `schedule`: this workflow deliberately has no `paths:` filter and
# runs weekly. Advisories are published against code that has not changed —
# the wasmtime and pyo3 findings that motivated #165 sat in a Cargo.lock
# nobody had touched for months. A workflow that only fires when
# Cargo.lock changes cannot catch that class of problem.

name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — a fresh advisory-db scan against unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Supersede in-flight pull-request runs: pushing a new commit to a PR
# cancels the runs still compiling the previous one.
#
# Non-PR runs (main pushes, schedules, manual dispatch) are keyed by
# `run_id`, which is unique per run, so they are each alone in their
# group. That is deliberate and not the same as `cancel-in-progress:
# false`: a concurrency group holds at most one running and one pending
# run, and a newer pending run EVICTS the older pending one. Grouping
# every main push under `refs/heads/main` would therefore still destroy
# the CI record for an intermediate main commit when merges land close
# together, with cancellation disabled or not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # Vulnerabilities fail the build. Unmaintained/unsound *warnings* do
      # not: the four currently outstanding (number_prefix, paste,
      # rustls-pemfile, scc) are all pinned by upstream crates we do not
      # control, so failing on them would mean a permanently red gate that
      # people learn to ignore. They are still printed in the log, and the
      # rationale for each is recorded in deny.toml.
      - name: Scan Cargo.lock for advisories
        run: cargo audit --color always

  deny:
    name: cargo-deny · ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Split so a licence failure and an advisory failure are
        # distinguishable at a glance in the checks list.
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v7

      - name: cargo-deny ${{ matrix.check }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}

  msrv:
    # Named without the version: a job-level `name` cannot reference `steps`,
    # and hardcoding a number here would be a second place to forget to bump.
    name: MSRV · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Split by platform because no single runner can build the whole
      # workspace. `larql-compute-metal` takes `blas-src` only under
      # `cfg(target_os = "macos")` while its examples `extern crate blas_src`
      # unconditionally, so on Linux they fail to resolve at *any* toolchain —
      # nothing to do with the MSRV. Its own workflow is macOS-only for the
      # same reason.
      #
      # So: Linux checks the workspace minus that crate (covering the
      # cfg(linux) OpenBLAS paths in larql-compute and larql-inference), and
      # macOS checks the crate Linux cannot. Between them every member crate
      # is MSRV-gated with no silent hole.
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace --all-targets --exclude larql-compute-metal
          - os: macos-14
            args: -p larql-compute-metal --all-targets
    steps:
      - uses: actions/checkout@v7

      # Read the declared MSRV out of Cargo.toml rather than hardcoding it
      # here, so bumping rust-version in one place updates the gate too.
      - name: Read declared rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no rust-version found in workspace Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev pkg-config

      - name: Cache cargo registry (downloads only, never target/)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-reg2-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-reg2-msrv-${{ steps.msrv.outputs.version }}-

      - name: No compiled workspace artefacts may be restored
        shell: bash
        run: |
          # The cache above carries downloads only. A target/ restored from
          # another commit can satisfy a link against stale code, so a green
          # matrix would be evidence about an artefact that is not in this
          # commit. Fail loudly rather than build on one.
          if [ -e target ]; then
            echo "::error::target/ was restored from cache - the cache key or path is wrong"
            exit 1
          fi

      # This is `cargo check` at the pinned toolchain rather than
      # `cargo msrv verify`. cargo-msrv bisects across many toolchains to
      # *discover* the minimum; we already know what we claim, and the only
      # question CI needs answered is whether the claim is true. One pinned
      # check answers it in a fraction of the time.
      #
      # `--locked` matters: without it cargo may resolve a newer dependency
      # than Cargo.lock pins and the job would test a graph nobody ships.
      #
      # `RUSTUP_TOOLCHAIN` matters more. `rust-toolchain.toml` pins the
      # DEVELOPMENT toolchain and rustup honours that file over whatever
      # `dtolnay/rust-toolchain` installed, so from the day the pin landed
      # (2026-08-22) this step silently checked at the development version
      # and the gate was hollow. The env var outranks the file, and the
      # step before the check refuses to run it under any other compiler.
      - name: Report the compiler running the gate
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          rustc --version
          cargo --version
          # `rust-version` may be two components ("1.98"); rustc reports
          # three ("1.98.0"). The declared version must equal the running
          # one or be its major.minor prefix.
          declared="${{ steps.msrv.outputs.version }}"
          actual=$(rustc --version | awk '{print $2}')
          case "$actual" in
            "$declared"|"$declared".*) echo "MSRV gate runs rustc $actual (declared $declared)" ;;
            *)
              echo "::error::MSRV gate would run rustc $actual, not the declared $declared"
              exit 1
              ;;
          esac

      - name: Check at declared MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check ${{ matrix.args }} --locked

  doc-links:
    name: doc links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Docs move between docs/ and crates/*/docs/ and their links get left
      # behind: the tree carried 45 dead relative links on 2026-08-07, seven of
      # them in README.md alone (found by an outside contributor, PR #211).
      # Nothing fails when a link dies -- the reader just lands nowhere -- so
      # it needs a gate rather than review attention.
      - name: Check relative documentation links
        run: python3 scripts/check_doc_links.py

      # The link checker above reports every markdown link resolving -- and
      # is right -- while a 2026-08-22 audit of 311 documents found ~90
      # broken references, NOT ONE of them a markdown link. They were inline
      # paths, file.rs:LINE coordinates, --example and --bench names, make
      # targets and env vars, every class structurally invisible to that
      # gate. That is how the drift accumulated for months with CI green.
      #
      # References the prose already labels ("(new)", "does not exist") are
      # not findings: the reader is correctly informed, and a gate that
      # cries wolf on legitimate content gets switched off.
      - name: Check documentation code references
        run: python3 scripts/check_doc_references.py --strict

  proto-lint:
    name: buf lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint gRPC schemas
        run: buf lint

      # Catches a malformed schema that lint alone would not (bad imports,
      # duplicate field numbers, unresolvable types).
      - name: Build descriptor set
        run: buf build --output /dev/null
