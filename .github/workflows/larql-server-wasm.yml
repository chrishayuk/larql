# larql-server WASM CI
#
# Verifies that the OS-IO gating in larql-server does not regress and surfaces
# the empirical picture of what its inline tests do in wasm32-unknown-unknown.
#
# Integration tests in tests/ reference gated modules (axum, tokio, band_utils,
# routes) — compile errors from those files are the expected empirical signal
# and are preserved as CI evidence for follow-up gating decisions.
#
# fail-fast is false: all failures must be visible.

name: larql-server-wasm

on:
  push:
    branches: [main]
    paths:
      - 'crates/larql-server/**'
      - 'crates/larql-router-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-server-wasm.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'crates/larql-server/**'
      - 'crates/larql-router-protocol/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/larql-server-wasm.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    name: wasm · ${{ matrix.mode.name }}
    runs-on: ubuntu-24.04
    # Longer timeout: protobuf-src compiles protoc from source on Linux.
    timeout-minutes: 35
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        mode:
          - name: serial
            toolchain: stable
            rustflags: ''
          - name: parallel
            toolchain: nightly
            rustflags: '-C target-feature=+atomics,+bulk-memory,+mutable-globals'

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (${{ matrix.mode.toolchain }}) + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.mode.toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Cache cargo registry + build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm32-cargo-server-${{ matrix.mode.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm32-cargo-server-${{ matrix.mode.name }}-

      - name: Format check
        run: cargo fmt -p larql-server -- --check

      - name: Check
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo check -p larql-server --target wasm32-unknown-unknown

      - name: Clippy
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: cargo clippy -p larql-server --target wasm32-unknown-unknown -- -D warnings

      - name: wasm-pack test · node
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: wasm-pack test --node crates/larql-server

      - name: wasm-pack test · firefox
        env:
          RUSTFLAGS: ${{ matrix.mode.rustflags }}
        run: wasm-pack test --firefox --headless crates/larql-server
