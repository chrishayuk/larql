# Dependabot — keep GitHub Actions versions current.
#
# Cargo and pip are intentionally not tracked here:
#   - cargo: workspace deps move via PRs that update Cargo.lock directly;
#     Dependabot's per-crate Cargo.toml proposals don't match how this
#     repo bumps versions.
#   - pip: Python bindings use uv (`crates/larql-python/uv.lock`), which
#     Dependabot's pip ecosystem doesn't read.
#
# Actions are the one place Dependabot is well-supported and worth the noise.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # One grouped PR per week instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # scripts/prec_diag is pinned to transformers 5.5.0: PREC-DIAG-1's CI checks
  # the sha256 of its modeling_gemma3.py, so a bump fails by design. Limit 0
  # turns off version updates for this directory; the ignore also stops
  # security-update PRs for transformers here (its alerts are dismissed as
  # accepted risk for this local research harness).
  - package-ecosystem: "pip"
    directory: "/scripts/prec_diag"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "transformers"
