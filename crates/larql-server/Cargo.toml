[package]
name = "larql-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server for vindex knowledge queries and inference"

[lib]
name = "larql_server"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "larql-server"
path = "src/main.rs"

[dependencies]
larql-router-protocol = { path = "../larql-router-protocol" }

half = "2"
sha2 = "0.10"
# Constant-time byte equality for API-key comparison (auth middleware).
# Already in the lockfile via rustls; declared here as a direct dep so the
# threat-model rationale is visible at the crate boundary.
subtle = "2.6"
prost = "0.13"
async-stream = "0.3"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

clap = { version = "4", features = ["derive", "env"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"

[features]
default = []
# Enable Metal-backed GPU expert kernels on the shard server.  Forwards to
# `larql-compute`'s `metal` feature.  macOS-only.
metal-experts = ["larql-compute/metal"]

[build-dependencies]
tonic-build = "0.13"

# See `crates/larql-router-protocol/Cargo.toml` for the Windows
# rationale: `protobuf-src` builds protoc via cmake and the link step
# fails on windows-latest. On Windows we rely on a system protoc
# (installed by CI via `arduino/setup-protoc`).
[target.'cfg(not(windows))'.build-dependencies]
protobuf-src = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
larql-vindex = { path = "../larql-vindex", features = ["remote"] }
larql-inference = { path = "../larql-inference" }
larql-models = { path = "../larql-models" }
# Optional Metal backend for shard-side GPU experts (macOS).  When the
# `metal-experts` feature is enabled, the server uses
# `MetalBackend::run_experts_preselected_metal` to dispatch each layer's
# selected experts on the GPU instead of running them per-expert on CPU.
larql-compute = { path = "../larql-compute" }
rayon = "1.10"
libc = "0.2"
memmap2 = "0.9"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
utoipa = { version = "5", features = ["axum_extras", "preserve_order"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-cert]
claimed-level = 3
diagonalization-gate = "static-partition"
notes = "production binary STATIC; no call_indirect, no non-intrinsic imports; L2 PASS"
