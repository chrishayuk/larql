[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false
description = "Build/certification automation tasks"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
cargo_metadata = "0.19"
wasmparser = "0.248"
ascent = "0.7"
