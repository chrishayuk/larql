[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false
description = "Build/certification automation tasks"

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
# Nightly-only: MIR-level RTA to classify dyn Trait vs fn-ptr dispatch.
# Subdivides DYNAMIC → DYNAMIC.DECIDABLE / DYNAMIC.UNDECIDABLE.
# Enable with: cargo xtask --features mir-analysis wasm-certify
mir-analysis = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
cargo_metadata = "0.19"
wasmparser = "0.248"
ascent = "0.7"
