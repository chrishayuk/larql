[package]
name = "larql-factory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Recipe-driven vindex builds: validation, identity, estimates, capability manifests, cards and staged orchestration."
keywords = ["vindex", "factory", "recipe", "schema"]
categories = ["data-structures", "encoding"]

[dependencies]
larql-models = { path = "../larql-models" }
larql-vindex-spec = { path = "../larql-vindex-spec" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = { workspace = true }

[dev-dependencies]
larql-vindex-spec = { path = "../larql-vindex-spec", features = ["test-utils"] }
tempfile = "3"
# `serial_test` because hf_token()'s tests mutate the process-wide
# HF_TOKEN env var — parallel test threads racing on it is a real,
# observed flake (see #[serial] on those two tests in estimate/http.rs).
serial_test = "3.2"

[lints]
workspace = true
