[package]
name = "larql-router"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Layer-sharding router for distributed larql-server deployments"

[lib]
name = "larql_router"
path = "src/lib.rs"

[[bin]]
name = "larql-router"
path = "src/main.rs"

[dependencies]
larql-router-protocol = { path = "../larql-router-protocol" }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = { workspace = true }
futures = "0.3"
futures-core = "0.3"

[features]
browser-tests = []

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "routing"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[package.metadata.wasm-cert]
claimed-level = 3
diagonalization-gate = "static-partition"
notes = "production binary STATIC; no call_indirect, no non-intrinsic imports; L2 PASS"
