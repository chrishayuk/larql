[package]
name = "larql-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for LARQL knowledge graph engine and vindex"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
larql-core = { path = "../larql-core" }
larql-inference = { path = "../larql-inference" }
larql-models = { path = "../larql-models" }
larql-vindex = { path = "../larql-vindex", features = ["remote"] }
larql-lql = { path = "../larql-lql" }
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"
ndarray = "0.16"
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }

[package.metadata.wasm-cert]
claimed-level = 0
diagonalization-gate = "uncertified"
notes = "no wasm32 boundary decision made yet"
