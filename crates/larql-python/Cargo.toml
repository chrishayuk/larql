[package]
name = "larql-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for LARQL graphs, VectorIndex access, LQL sessions, walks and traces."

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
larql-core = { path = "../larql-core" }
larql-inference = { path = "../larql-inference" }
larql-kv = { path = "../larql-kv" }
larql-models = { path = "../larql-models" }
larql-vindex = { path = "../larql-vindex" }
larql-lql = { path = "../larql-lql" }
pyo3 = { version = "0.29" }
numpy = "0.29"
ndarray = "0.16"
memmap2 = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }
larql-vindex = { path = "../larql-vindex", features = ["test-utils"] }
tempfile = "3"

[lints]
workspace = true
