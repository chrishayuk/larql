[package]
name = "larql-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Transformer inference engine — forward pass, attention, FFN, layer norm from safetensors weights"
keywords = ["transformer", "inference", "llm", "interpretability"]
categories = ["science"]

[dependencies]
larql-models = { path = "../larql-models" }
larql-compute = { path = "../larql-compute" }
larql-core = { path = "../larql-core" }
larql-vindex = { path = "../larql-vindex" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zip = { version = "2", default-features = false }
rand = "0.8"
rand_distr = "0.4"

# Model weights
safetensors = "0.7"
memmap2 = "0.9"

# System
libc = "0.2"

# Matrix ops (BLAS-accelerated on supported platforms; pure-Rust ndarray on Android)
ndarray = "0.16"

# Parallelism for the walk loop (per-feature work is embarrassingly parallel).
rayon = "1.10"

# Used by `residual_diff::capture` to drive the backend-side per-layer
# dump hooks into a private dir per call. dev-only would force every
# crate consumer to pull tempfile in just to use the in-memory diff API.
tempfile = "3"

# Chat-template rendering (HF `tokenizer_config.json::chat_template` is Jinja).
# `minijinja-contrib` ships `pycompat::unknown_method_callback` which gives us
# Python-style method calls (`.get()`, `.items()`, `.startswith()`, …) that
# Gemma 4 / Qwen / Llama-3 chat templates rely on.
minijinja = { version = "2", features = ["loader"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Remote FFN backend and gRPC client — non-wasm only; see [target.'cfg(not(target_arch = "wasm32"))'].
half = "2"
prost = "0.13"
larql-router-protocol = { path = "../larql-router-protocol" }
async-stream = "0.3"
futures = "0.3"

# WASM expert registry (pure-Rust interpreter — no Cranelift, runs on all targets)
wasmi = "1"
anyhow = "1"

# REUSE: original wasmtime JIT backend, optional — activate with `expert-jit` feature.
# Cranelift requires a 64-bit host; arm32/Android uses wasmi above instead.
wasmtime = { version = ">=36.0.7", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = ">=36.0.7", optional = true }

# Portable 64-bit atomics (software fallback on arm32 / other targets without
# native 64-bit atomic ops).
portable-atomic = "1"


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"], default-features = false }
openblas-src = { version = "0.10", features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(target_os = "windows")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"], default-features = false }
openblas-src = { version = "0.10", features = ["system"] }

[target.'cfg(target_os = "android")'.dependencies]
# Android: Minimal blas-src without external dependencies.
blas-src = { version = "0.10", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Tokenizer — onig/Oniguruma backend; not wasm-safe (wasm32 uses unstable_wasm below).
tokenizers = "0.21"
# Blocking HTTP with ring-based TLS — incompatible with wasm32.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Async runtime with thread pool — mio/epoll not available on wasm32.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }
# gRPC client with ring TLS — incompatible with wasm32.
tonic = { version = "0.13", features = ["tls-ring", "tls-webpki-roots"] }

[features]
default = []
metal = ["larql-compute/metal"]
# Enable the original wasmtime JIT/AOT expert backend (desktop platforms only).
# wasmi remains the active backend regardless; this feature only gates the
# preserved loader_jit/caller_jit modules for REUSE compliance.
expert-jit = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Opt-in gate for the Firefox browser-based wasm_bindgen_test runner.
browser-tests = []

[[example]]
name = "cpu_gpu_diag"
required-features = ["metal"]

[[example]]
name = "decode_vs_prefill"
required-features = ["metal"]

[[example]]
name = "residual_diff"
required-features = ["metal"]

[[example]]
name = "stage_bisect"
required-features = ["metal"]

# These examples use `extern crate blas_src` which is a native-only dep
# (not present in the wasm32 target dep graph). Gate them so `cargo test
# --target wasm32-unknown-unknown` skips compiling them.
[[example]]
name = "bench_seqlen"
required-features = ["metal"]

[[example]]
name = "moe_grid_generate"
required-features = ["metal"]

[[example]]
name = "test_q4_projection_cosine"
required-features = ["metal"]

[[example]]
name = "test_q4_accuracy"
required-features = ["metal"]

[[example]]
name = "remote_walk_parity"
required-features = ["metal"]

[[example]]
name = "q4k_remote_parity"
required-features = ["metal"]

[dev-dependencies]
assert_approx_eq = "1"
tempfile = "3"
larql-kv = { path = "../larql-kv" }
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "wire_codec"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
# Tokenizer with fancy-regex backend — no Oniguruma C bindings.
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm"] }
# Async HTTP without blocking API or ring TLS (uses browser fetch).
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[package.metadata.wasm-cert]
claimed-level = 1
diagonalization-gate = "manual-review"
notes = "35+ files with fs/net/process traps ungated; zero wasm runtime tests"
