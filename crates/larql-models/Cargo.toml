[package]
name = "larql-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model source description, inventory, weight loading, quantized formats and multimodal contracts for LARQL."
keywords = ["transformer", "model-config", "llm", "architecture"]
categories = ["data-structures"]

[dependencies]
larql-vindex-spec = { path = "../larql-vindex-spec" }
ndarray = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Model weight loading
safetensors = "0.7"
memmap2 = "0.9"

[features]
default = []
# Synthetic `ModelWeights` builders for downstream test crates. Off by
# default so production builds never compile the fixture code. Enable
# from a consumer's `[dev-dependencies]` entry, e.g.
# `larql-models = { path = "../larql-models", features = ["test-utils"] }`.
test-utils = []

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "models"
harness = false

[lints]
workspace = true
