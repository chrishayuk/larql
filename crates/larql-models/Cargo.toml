[package]
name = "larql-models"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Model architecture definitions for LARQL — traits, config parsing, tensor key mappings"
keywords = ["transformer", "model-config", "llm", "architecture"]
categories = ["data-structures"]

[dependencies]
ndarray = "0.16"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Model weight loading
safetensors = "0.7"
memmap2 = "0.9"

[features]
browser-tests = []

[dev-dependencies]
tempfile = "3"
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "models"
harness = false

[package.metadata.wasm-cert]
claimed-level = 2
diagonalization-gate = "manual-review"
notes = "fs traps in detect/loading modules; compile-consistent only"
