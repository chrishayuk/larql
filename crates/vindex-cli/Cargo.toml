[package]
name = "vindex-cli"
version = "0.8.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Format-native VINDEX3 tooling: plan, encode, inspect, verify, compile representations and export."

# Inspection answers from the container's own declarations. Planning and
# encoding also accept remote HF sources; update accesses release infrastructure.
# Representation compilation and supported export live here; execution,
# observation and measurement/search orchestration live in LARQL.
# larql-vindex still brings its broader dependency tree.

[[bin]]
name = "vindex"
path = "src/main.rs"

[dependencies]
larql-vindex = { path = "../larql-vindex" }
larql-models = { path = "../larql-models" }
clap = { version = "4.5", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
