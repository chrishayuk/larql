[package]
name = "larql-kv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable KV-cache engines for larql-inference (markov-rs, unlimited-context, turbo-quant, apollo)"

[dependencies]
larql-inference = { path = "../larql-inference" }
larql-execution = { path = "../larql-execution" }
larql-compute = { path = "../larql-compute" }
larql-compute-metal = { path = "../larql-compute-metal", optional = true }
larql-vindex = { path = "../larql-vindex" }
larql-boundary = { path = "../larql-boundary" }

serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

ndarray = "0.16"
zip = { version = "2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"], default-features = false }
openblas-src = { version = "0.10", features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

# Windows: no BLAS backend. See `larql-compute/Cargo.toml` for the
# rationale — the system OpenBLAS race manifests primarily here,
# where most of the "compare two compute paths against self" tests
# live (vindex_compare, markov_residual). `blas-src` kept featureless
# so existing `extern crate blas_src;` declarations still compile.
[target.'cfg(target_os = "windows")'.dependencies]
ndarray = "0.16"
blas-src = { version = "0.10", default-features = false }

[features]
default = []
gpu = ["dep:larql-compute-metal", "larql-inference/gpu"]

[dev-dependencies]
# CONTINUATION-MEM-1's harness reads KvView::backing_addresses (test-utils only).
larql-vindex = { path = "../larql-vindex", features = ["test-utils"] }
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# Test-only: Lloyd-Max codebook regeneration pins (turbo_quant/codebooks.rs).
rand = "0.8"
rand_distr = "0.4"

[[bench]]
name = "engine_decode"
harness = false


[lints]
workspace = true
