# Runnable demonstrations of larql's shipped capabilities.
#
# Split out of the individual crates' `examples/` so that "how do I use
# this" has one home, separate from benchmarks/diagnostics (which stay
# next to the code they exercise) and from research probes (which live
# in chris-experiments, pinned to the larql revision that produced their
# verdict).
[package]
name = "larql-demos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runnable demonstrations of larql's shipped capabilities"
publish = false
autoexamples = false        # folders mirror the source crate; all declared below

[dependencies]
larql-boundary = { path = "../larql-boundary" }
larql-compute = { path = "../larql-compute" }
larql-core = { path = "../larql-core" }
larql-inference = { path = "../larql-inference" }
larql-kv = { path = "../larql-kv" }
larql-lql = { path = "../larql-lql" }
# Scratch dirs for the self-contained VINDEX3 LQL demo.
tempfile = "3"
larql-models = { path = "../larql-models" }
larql-router-protocol = { path = "../larql-router-protocol" }
larql-server = { path = "../larql-server" }
larql-vindex = { path = "../larql-vindex" }

safetensors = "0.7"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tokenizers = "0.21"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The larql-server demos are async clients.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = "0.13"
tower = { version = "0.5", features = ["limit"] }

# BLAS backend per target, mirroring larql-inference. The compute demos
# carry `extern crate blas_src;`, so it has to be linked even where the
# crate is featureless.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["openblas"], default-features = false }
openblas-src = { version = "0.10", features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.16", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(target_os = "windows")'.dependencies]
ndarray = "0.16"
blas-src = { version = "0.10", default-features = false }

[features]
default = []
# Cascade the flags the demos themselves test for, so `#[cfg(feature = ..)]`
# in a demo resolves against a real feature rather than warning as unexpected.
gpu = ["larql-inference/gpu", "larql-vindex/gpu"]
msgpack = ["larql-core/msgpack"]

