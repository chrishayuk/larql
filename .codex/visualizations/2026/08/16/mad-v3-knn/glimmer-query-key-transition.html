<div id="mad-v3-key-transition">
  <style>
    #mad-v3-key-transition { color: var(--foreground); width: 100%; }
    #mad-v3-key-transition .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 8px 58px; color: var(--muted-foreground); }
    #mad-v3-key-transition .legend span { display: inline-flex; align-items: center; gap: 5px; }
    #mad-v3-key-transition .swatch { width: 18px; height: 3px; display: inline-block; }
    #mad-v3-key-transition svg { display: block; width: 100%; height: auto; overflow: visible; }
    #mad-v3-key-transition .grid { stroke: var(--border); stroke-width: 1; }
    #mad-v3-key-transition .axis { fill: var(--muted-foreground); }
    #mad-v3-key-transition .label { fill: var(--foreground); font-weight: 500; }
    #mad-v3-key-transition .op-area { fill: var(--viz-series-1); opacity: 0.13; }
    #mad-v3-key-transition .op-line { fill: none; stroke: var(--viz-series-1); stroke-width: 2; }
    #mad-v3-key-transition .headroom-line { fill: none; stroke: var(--viz-series-3); stroke-width: 2; }
    #mad-v3-key-transition .knn-line { fill: none; stroke: var(--viz-series-2); stroke-width: 2.5; }
    #mad-v3-key-transition .base { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 4 4; }
    #mad-v3-key-transition .annotation { fill: var(--foreground); }
    #mad-v3-key-transition .annotation-line { stroke: var(--muted-foreground); stroke-width: 1; }
    #mad-v3-key-transition .highlight { fill: var(--background); stroke: var(--foreground); stroke-width: 2; }
  </style>
  <div class="legend" aria-hidden="true">
    <span><i class="swatch" style="background:var(--viz-series-1)"></i>Hard-arm C operation purity, K=4</span>
    <span><i class="swatch" style="background:var(--viz-series-2)"></i>kNN gain over popularity @5%</span>
    <span><i class="swatch" style="background:var(--viz-series-3)"></i>Total oracle headroom @5%</span>
  </div>
  <svg viewBox="0 0 736 500" role="img" aria-labelledby="mad-v3-key-title mad-v3-key-desc">
    <title id="mad-v3-key-title">Glimmer canonical operation-key transition and next-layer address prediction</title>

    <g id="mad-v3-key-plot"></g>
  </svg>
</div>
