[workspace]
resolver = "2"
members = [
    # larql-specific
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-core",
    "crates/larql-vindex",
    "crates/larql-inference",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-server",
    "crates/larql-router",
    "crates/larql-router-protocol",
    "crates/larql-python",
    "crates/kv-cache-benchmark",
    "crates/larql-rotorquant",
    # portable (extract to sibling repos later, names stable)
    "crates/model-compute",
]
default-members = [
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-core",
    "crates/larql-vindex",
    "crates/larql-inference",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-server",
    "crates/larql-router",
    "crates/larql-router-protocol",
    "crates/kv-cache-benchmark",
    "crates/larql-rotorquant",
    "crates/model-compute",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = []
license = "Apache-2.0"
repository = "https://github.com/chrishayuk/chuk-larql-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.metadata.larql.unstable-features]
cuda = "Linux NVIDIA CUDA backend via cudarc/cuBLAS and NVRTC kernels."
cuda-oxide = "Experimental cuda-oxide custom-kernel pilot; build with +nightly-2026-04-03 and keep disabled by default."

# Workspace-wide clippy policy. Rust 1.95 promoted several stylistic
# lints from `pedantic` into the default group, which would force a
# huge amount of churn in long-standing exploratory/dev modules
# (`larql-cli/.../ov_rd/`, `parity.rs`, etc.). We allow the most
# pedantic of those at the workspace level so `cargo clippy --workspace
# -- -D warnings` (what `make ci` runs) stays green without having to
# rewrite every utility script. New code should still strive to satisfy
# them on its own.
[workspace.lints.rust]
# Many exploratory/dev modules (oracle_pq, ov_rd, shannon_cmd, parity)
# carry their own helper utilities that are reachable from main but
# clippy --tests can't see across that boundary cleanly.
dead_code = "allow"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
identity_op = "allow"
erasing_op = "allow"
large_enum_variant = "allow"
manual_is_multiple_of = "allow"
unnecessary_sort_by = "allow"
manual_div_ceil = "allow"
manual_checked_ops = "allow"
ptr_arg = "allow"
nonminimal_bool = "allow"
needless_pass_by_ref_mut = "allow"
type_complexity = "allow"
ifs_same_cond = "allow"
if_same_then_else = "allow"
unwrap_used = "allow"
doc_overindented_list_items = "allow"
doc_lazy_continuation = "allow"
multiple_bound_locations = "allow"
