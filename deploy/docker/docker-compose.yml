# Two-container topology: GPU attention + CPU FFN, fronted by larql-router.
#
# Usage:
#   cd deploy/docker
#   docker compose up --build
#
# Then send queries to http://localhost:8082 (router). The router shards
# attention RPCs to the `attention` service and FFN RPCs to the `ffn`
# service. Both containers read the same vindex from a shared volume.
#
# For CPU-only laptops without an NVIDIA GPU, use docker-compose.cpu.yml
# instead (single all-in-one larql-server).

services:
  ffn:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ffn
    image: larql-ffn:dev
    environment:
      ROLE: ffn
      PORT: 8080
      GRPC_PORT: 8081
      VINDEX_PATH: /data/vindex
      HF_REPO: ${HF_REPO:-chrishayuk/gemma-4-26b-a4b-it-vindex-expert-server}
      HF_TOKEN: ${HF_TOKEN:-}
      EXPERTS: "${EXPERTS:-}"
      WARMUP: "${WARMUP:-1}"
      JOIN: http://router:50052
      PUBLIC_URL: http://ffn:8080
    volumes:
      - ${VINDEX_SOURCE:-vindex_data}:/data/vindex
    ports:
      - "${FFN_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  attention:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gpu
      args:
        LARQL_CUDA_ARCH: "${LARQL_CUDA_ARCH:-89}"
        ENABLE_CUDA_OXIDE: "${ENABLE_CUDA_OXIDE:-0}"
    image: larql-gpu:dev
    gpus: all
    environment:
      ROLE: attention
      PORT: 8080
      GRPC_PORT: 8081
      VINDEX_PATH: /data/vindex
      HF_REPO: ${HF_REPO:-chrishayuk/gemma-4-26b-a4b-it-vindex-expert-server}
      HF_TOKEN: ${HF_TOKEN:-}
      KV_FORMAT: ${KV_FORMAT:-iso3}
      LAYERS: "${LAYERS:-}"
      LARQL_CUDA_ARCH: "${LARQL_CUDA_ARCH:-89}"
      JOIN: http://router:50052
      PUBLIC_URL: http://attention:8080
    volumes:
      - ${VINDEX_SOURCE:-vindex_data}:/data/vindex
    ports:
      - "${ATTENTION_HOST_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 20s   # cudarc PTX compile + weight load should still fit under 60 s warm.
    restart: unless-stopped

  router:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ffn
    image: larql-ffn:dev   # router lives in the same Linux/CPU image
    entrypoint: ["larql-router"]
    command:
      - --port=8080
      - --grid-port=50052
      - --timeout-secs=${LARQL_ROUTER_HOP_DEADLINE_SECS:-5}
    ports:
      - "${ROUTER_HOST_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped

volumes:
  vindex_data:
